<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>UdayFin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone app — one centered column, sticky bottom tab bar, slide-up sheet for adding */
:root {
  --bg: #edf2fa;
  --card: #ffffff;
  --ink: #0b1a36;
  --muted: #5a6880;
  --line: #dce4f1;
  --accent: #1d63e8;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebfd;
  --in: #0f8a5f;
  --in-soft: #def5ea;
  --out: #c8372d;
  --out-soft: #fbe6e4;
  --warn: #9a6408;
  --warn-soft: #fbefd8;
  --hero-a: #061a3d;
  --hero-b: #1554c9;
  --hero-c: #20c98a;
  --hi: #c8372d;
  --lo: #2fa36b;
  --hi-soft: #fbe6e4;
  --lo-soft: #def5ea;
  --display: "Sora", "Segoe UI", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #051430; --card: #0c2148; --ink: #e8efff; --muted: #94a6c8; --line: #1b3364;
    --accent: #5b9bff; --accent-ink: #051430; --accent-soft: #14305f;
    --in: #4be3a2; --in-soft: #0c3a35; --out: #ff8a7f; --out-soft: #3d1c2a;
    --warn: #f3b85c; --warn-soft: #3a2c14; --hero-a: #0a2a66; --hero-b: #1a5fe0; --hero-c: #1fbf86; --hi: #e8564a; --lo: #2e9e68; --hi-soft: #3d1c2a; --lo-soft: #0c3a35; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #051430; --card: #0c2148; --ink: #e8efff; --muted: #94a6c8; --line: #1b3364;
  --accent: #5b9bff; --accent-ink: #051430; --accent-soft: #14305f;
  --in: #4be3a2; --in-soft: #0c3a35; --out: #ff8a7f; --out-soft: #3d1c2a;
  --warn: #f3b85c; --warn-soft: #3a2c14; --hero-a: #0a2a66; --hero-b: #1a5fe0; --hero-c: #1fbf86; --hi: #e8564a; --lo: #2e9e68; --hi-soft: #3d1c2a; --lo-soft: #0c3a35; color-scheme: dark;
}
/* Logo themes: Ocean (blue to green, default), Mint (green-led), Royal (deep blue) */
:root[data-accent="mint"] { --accent: #0b8a5e; --accent-soft: #dcf3e8; --hero-a: #032a1f; --hero-b: #0b7a55; --hero-c: #2f8cff; }
:root[data-accent="royal"] { --accent: #1446c9; --accent-soft: #e0e8fb; --hero-a: #050f33; --hero-b: #1a3fbf; --hero-c: #4ad6a0; }
@media (prefers-color-scheme: dark) {
  :root[data-accent="mint"]:not([data-theme="light"]) { --accent: #43d39b; --accent-ink: #04221a; --accent-soft: #0f3a2e; --hero-a: #053325; --hero-b: #0d8a5f; --hero-c: #2f8cff; }
  :root[data-accent="royal"]:not([data-theme="light"]) { --accent: #7aa3ff; --accent-ink: #050f33; --accent-soft: #182c5c; --hero-a: #07164a; --hero-b: #2550d8; --hero-c: #2fbf86; }
}
:root[data-accent="mint"][data-theme="dark"] { --accent: #43d39b; --accent-ink: #04221a; --accent-soft: #0f3a2e; --hero-a: #053325; --hero-b: #0d8a5f; --hero-c: #2f8cff; }
:root[data-accent="royal"][data-theme="dark"] { --accent: #7aa3ff; --accent-ink: #050f33; --accent-soft: #182c5c; --hero-a: #07164a; --hero-b: #2550d8; --hero-c: #2fbf86; }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.swatch { border: 2px solid var(--line); border-radius: 14px; padding: 8px; background: var(--card); display: grid; gap: 6px; justify-items: center; font-size: 12px; font-weight: 700; color: var(--ink); }
.swatch i { width: 100%; height: 40px; border-radius: 10px; display: block; }
.swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

/* Motion */
.app.enter > * { animation: rise .28s ease-out both; }
.app.enter > *:nth-child(2) { animation-delay: .03s; } .app.enter > *:nth-child(3) { animation-delay: .06s; } .app.enter > *:nth-child(4) { animation-delay: .09s; } .app.enter > *:nth-child(n+5) { animation-delay: .12s; }
@keyframes rise { from { opacity: .4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.btn, .chips button, .quick button, .nav button { transition: transform .12s ease; }
.btn:active, .chips button:active, .quick button:active { transform: scale(.97); }
.greet-big { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1.2; }
.ico.cat { font-size: 19px; }
.ico.cat.out { background: var(--out-soft); }
.ico.cat.in { background: var(--in-soft); }

/* Babe */
.babe { width: 34px; height: 34px; flex: none; display: block; }
.babe-row { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
.babe-row .bubble { max-width: calc(100% - 42px); }
.typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }

/* Welcome */
.welcome { position: fixed; inset: 0; z-index: 65; background: var(--bg); display: grid; grid-template-rows: 1fr auto; overflow-y: auto;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.welcome .slide { max-width: 420px; margin: 0 auto; width: 100%; display: grid; gap: 16px; align-content: center; text-align: center; animation: rise .35s ease-out; }
.welcome .art { width: 132px; height: 132px; margin: 0 auto; border-radius: 34px; display: grid; place-items: center; font-size: 60px; background: linear-gradient(140deg, var(--hero-a), var(--hero-b) 65%, var(--hero-c) 140%); color: #fff; box-shadow: 0 16px 40px rgba(6,26,61,.25); overflow: hidden; }
.welcome .art img { width: 100%; height: 100%; object-fit: cover; }
.welcome h2 { font-size: 26px; }
.welcome p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
.welcome .feats { display: grid; gap: 8px; text-align: left; }
.welcome .feats div { background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.welcome .foot { max-width: 420px; margin: 0 auto; width: 100%; display: grid; gap: 12px; padding-top: 16px; }
.welcome .pips { display: flex; gap: 6px; justify-content: center; }
.welcome .pips i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .2s; }
.welcome .pips i.on { width: 22px; background: var(--accent); }
.welcome .setup { display: grid; gap: 10px; text-align: left; }
@media (prefers-reduced-motion: reduce) { .app.enter > *, .welcome .slide, .typing i { animation: none !important; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.app {
  max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 16px;
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.draft { font-size: 12px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-weight: 600; }

/* Top bar */
.topbar { display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 40px; height: 40px; border-radius: 12px; display: block; object-fit: cover; background: #051838; }
.brand h1 .fin { color: var(--in); }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick button { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px; text-align: left; display: grid; gap: 2px; }
.quick button b { font-size: 14px; }
.quick button span { font-size: 12px; color: var(--muted); }
.brand h1 { font-size: 19px; font-weight: 700; }
.greet { font-size: 12px; color: var(--muted); }

/* Hero */
.hero { border-radius: 20px; padding: 20px; color: #fff; background: linear-gradient(140deg, var(--hero-a) 0%, var(--hero-b) 62%, var(--hero-c) 130%); display: grid; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.08); }
.hero .label { color: rgba(255,255,255,.75); }
.hero .big { font-family: var(--display); font-size: 36px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; z-index: 1; }
.hero-pill { background: rgba(255,255,255,.14); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.hero-pill .v { font-family: var(--display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-note { font-size: 12px; color: rgba(255,255,255,.85); position: relative; z-index: 1; }

/* Cards & lists */
.card { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 13px; padding: 4px 0; }
.list { display: grid; }
.item { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px; }
.ico.in { background: var(--in-soft); color: var(--in); }
.ico.out { background: var(--out-soft); color: var(--out); }
.ico.soon { background: var(--accent-soft); color: var(--accent); }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { font-size: 12px; color: var(--muted); }
.amt { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.amt.in { color: var(--in); }
.amt.out { color: var(--out); }
.amt.soon { color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.chip.ok { background: var(--in-soft); color: var(--in); }
.chip.late { background: var(--out-soft); color: var(--out); }
.chip.ex { background: var(--warn-soft); color: var(--warn); }

/* Month stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat.in { background: var(--in-soft); }
.stat.out { background: var(--out-soft); }
.stat .v { font-family: var(--display); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat.in .v { color: var(--in); }
.stat.out .v { color: var(--out); }
.cats { display: grid; gap: 8px; }
.catrow { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.catbar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.catbar span { display: block; height: 100%; background: var(--out); border-radius: 99px; }

/* Debts */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 9px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.debt { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.debt.done { opacity: .65; }
.debt-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.debt .name { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.debt .left { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.debt .left.owe { color: var(--out); }
.debt .left.owed { color: var(--in); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--in); border-radius: 99px; }
.payrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.check input { width: 16px; height: 16px; }
.hist { margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.hist li { display: flex; justify-content: space-between; }
.rowend { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* Forms */
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; }
textarea { min-height: 90px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12px; font-weight: 700; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 11px 16px; }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.block { width: 100%; padding: 14px; font-size: 16px; }
.btn.danger { background: var(--out-soft); color: var(--out); }
.btn:disabled { opacity: .5; }
.del { background: none; border: 0; color: var(--muted); font-size: 12px; font-weight: 700; padding: 4px 6px; border-radius: 8px; }
.del.arm { background: var(--out); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.nav .add { grid-column: 3; }
.nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--muted); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav .add { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, var(--hero-b), var(--hero-c)); color: var(--accent-ink); margin: -22px auto 0; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(21,84,201,.35); color: #fff; padding: 0; }
.nav .add svg { width: 26px; height: 26px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(8,14,24,.5); z-index: 30; display: grid; align-items: end; }
.sheet { background: var(--card); border-radius: 22px 22px 0 0; width: 100%; max-width: 480px; margin: 0 auto; max-height: 92vh; overflow-y: auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 0 auto; }
.typeseg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.typeseg button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px; font-weight: 700; color: var(--muted); }
.typeseg button[data-t="out"][aria-pressed="true"] { background: var(--out-soft); color: var(--out); border-color: var(--out); }
.typeseg button[data-t="in"][aria-pressed="true"] { background: var(--in-soft); color: var(--in); border-color: var(--in); }
.amount-in { font-family: var(--display); font-size: 30px; font-weight: 700; text-align: center; padding: 14px; }

/* High ON / Low ON */
.priseg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.priseg button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px; text-align: left; display: grid; gap: 2px; }
.priseg button b { font-size: 14px; }
.priseg button span { font-size: 11px; color: var(--muted); }
.priseg button[data-p="high"][aria-pressed="true"] { border-color: var(--hi); background: var(--hi-soft); }
.priseg button[data-p="high"][aria-pressed="true"] b { color: var(--hi); }
.priseg button[data-p="low"][aria-pressed="true"] { border-color: var(--lo); background: var(--lo-soft); }
.priseg button[data-p="low"][aria-pressed="true"] b { color: var(--lo); }
.pchip { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 1px 6px; border-radius: 99px; margin-left: 4px; vertical-align: 1px; }
.pchip.high { background: var(--hi-soft); color: var(--hi); }
.pchip.low { background: var(--lo-soft); color: var(--lo); }

/* Weekly dashboard */
.weeknav { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 8px; align-items: center; background: var(--card); border-radius: 14px; padding: 6px; }
.weeknav button { border: 0; background: var(--bg); border-radius: 10px; height: 40px; font-size: 18px; font-weight: 700; color: var(--ink); }
.weeknav button:disabled { opacity: .35; }
.weeknav .wk { text-align: center; }
.weeknav .wk b { display: block; font-family: var(--display); font-size: 15px; }
.weeknav .wk span { font-size: 12px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--card); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi.wide { grid-column: 1 / -1; background: linear-gradient(140deg, var(--hero-a), var(--hero-b)); color: #fff; }
.kpi.wide .label { color: rgba(255,255,255,.75); }
.kpi .v { font-family: var(--display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi.wide .v { font-size: 30px; }
.kpi .d { font-size: 12px; font-weight: 700; }
.kpi .d.good { color: var(--in); }
.kpi .d.bad { color: var(--out); }
.kpi.wide .d { color: rgba(255,255,255,.9); }
.chartbox { position: relative; }
.chartbox svg { display: block; width: 100%; height: auto; overflow: visible; }
.chartbox .axis { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chartbox .axis.today { fill: var(--ink); font-weight: 700; }
.chartbox .grid { stroke: var(--line); stroke-width: 1; }
.chartbox .hit { fill: transparent; cursor: pointer; }
.chartbox .sel { fill: var(--accent-soft); }
.tip { position: absolute; z-index: 5; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.4; pointer-events: none; min-width: 120px; transform: translate(-50%, -100%); }

  function dailyChart(days) {
    const W = 360, H = 190, padL = 44, padR = 8, padT = 12, padB = 26;
    const totals = days.map(d => d.high + d.low + d.none);
    const raw = Math.max(...totals, 0);
    // Round the top of the scale to a tidy number so the grid labels are real values
    const step = (() => { if (!raw) return 100; const mag = 10 ** Math.floor(Math.log10(raw / 100 / 3)); return [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s * 3 >= raw / 100) * 100; })();
    const top = step * 3;
    const ih = H - padT - padB, iw = W - padL - padR, bw = iw / days.length;
    const y = v => padT + ih - v / top * ih;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Spending each day this week");
    const mk = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.append(e); return e; };
    const defs = mk("defs", {});
    defs.innerHTML = '<pattern id="loTex" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--lo)"/><rect width="2" height="6" fill="rgba(255,255,255,.38)"/></pattern>';
    for (let i = 0; i <= 3; i++) {
      const v = step * i, yy = y(v);
      mk("line", { x1: padL, x2: W - padR, y1: yy, y2: yy, class: "grid" });
      const t = mk("text", { x: padL - 6, y: yy + 4, "text-anchor": "end", class: "axis" });
      t.textContent = v >= 100000 ? (v / 100000) + "k" : String(v / 100);
    }
    const sel = mk("rect", { x: 0, y: padT, width: bw - 4, height: ih, rx: 6, class: "sel", visibility: "hidden" });
    const detail = el("div", { class: "insight minirows", "aria-live": "polite" });
    const shows = [];
    const td = today();
    days.forEach((d, i) => {
      const x = padL + i * bw + bw * 0.22, w = bw * 0.56;
      let base = d.none + d.low + d.high;
      // Stack from the baseline: High ON at the bottom, then Low ON, then unmarked; 2px gaps between parts
      const parts = [["high", d.high, "var(--hi)"], ["low", d.low, "url(#loTex)"], ["none", d.none, "var(--muted)"]];
      let cur = 0;
      const visible = parts.filter(p => p[1] > 0);
      visible.forEach(([k, v, fill], j) => {
        const y0 = y(cur), y1 = y(cur + v);
        const isTop = j === visible.length - 1;

          const r = 4;
          mk("path", { d: `M${x},${y0} V${y0 - h + r} Q${x},${y0 - h} ${x + r},${y0 - h} H${x + w - r} Q${x + w},${y0 - h} ${x + w},${y0 - h + r} V${y0} Z`, fill });
        } else mk("rect", { x, y: y0 - h, width: w, height: h, fill });
        cur += v;
      });
      const lab = mk("text", { x: padL + i * bw + bw / 2, y: H - 8, "text-anchor": "middle", class: "axis" + (d.current ? " today" : "") });
      lab.textContent = d.label;
      const hit = mk("rect", { x: padL + i * bw, y: 0, width: bw, height: H, class: "hit", tabindex: "0", role: "button", "aria-label": `${d.label}: ${money(base)}` });
      shows[i] = () => {
        sel.setAttribute("x", padL + i * bw + 2); sel.setAttribute("visibility", "visible");
        detail.replaceChildren(...[el("b", {}, d.title),
          el("div", { class: "rowend" }, el("span", { style: "color:var(--hi);font-weight:700" }, "High ON"), el("span", {}, money(d.high))),
          el("div", { class: "rowend" }, el("span", { style: "color:var(--lo);font-weight:700" }, "Low ON"), el("span", {}, money(d.low))),
          d.none ? el("div", { class: "rowend" }, el("span", {}, "Not marked"), el("span", {}, money(d.none))) : null,
          el("div", { class: "rowend", style: "font-weight:700;border-top:1px solid var(--line);padding-top:4px" }, el("span", {}, "Total spent"), el("span", {}, money(base)))].filter(Boolean));
      };
      hit.addEventListener("click", shows[i]); hit.addEventListener("focus", shows[i]);

  function historyItems() {
    const items = [];
    D.txns.forEach(t => {
      const kind = t.type === "transfer" ? "transfer" : t.type === "move" ? (t.cat === "Savings" ? "savings" : "invest") : (t.cat === "Debt payment" || t.cat === "Got back") ? "debt" : t.type;

    // Events recorded outside your accounts (no linked entry above)
    const synthetic = (date, at, kind, title, sub, amount, cls, icon) => items.push({ date, at: at || 0, kind, title, sub, amount, cls, icon, accs: [], text: title + " " + sub });
    D.savings.forEach(p => (p.log || []).forEach(l => { if (!l.txn) synthetic(l.date, l.at, "savings", (l.type === "add" ? "Added to " : "Took from ") + p.name, "Savings · not from an account", money(l.amount), "mv", "⇄"); }));

  function backupText() {
    const { pin, ...settings } = D.settings;
    return JSON.stringify({ app: "udayfin", savedAt: new Date().toISOString(), data: { ...D, settings } });
  }
  function markBackup() { D.settings.lastBackup = today(); save(); }
  function saveBackupFile() {
    try {
      const blob = new Blob([backupText()], { type: "application/json" });
      const a = el("a", { href: URL.createObjectURL(blob), download: `udayfin-backup-${today()}.json` });
      document.body.append(a); a.click(); a.remove();
      markBackup(); render();
      toast("Backup saved to your downloads");
    } catch { toast("Couldn't save a file here. Use Copy backup."); }
  }
  function copyBackup() {
    const txt = backupText();
    navigator.clipboard?.writeText(txt).then(() => { markBackup(); render(); toast("Backup copied. Paste it somewhere safe."); }, () => {
      const ta = $("#restoreBox"); if (ta) { ta.value = txt; ta.select(); } toast("Select the text in the box and copy it");
    }) ?? toast("Copy isn't available here");
  }
  function restore(txt) {
    try {
      const o = JSON.parse(txt);
      const data = o.data || o;
      if (!data || !Array.isArray(data.txns) || !Array.isArray(data.debts)) throw 0;
      const keepPin = D.settings.pin;
      D = normalize({ ...data });
      D.settings.pin = keepPin;
      commit("Backup restored");
    } catch { toast("That isn't an UdayFin backup"); }
  }

  // ---------- UdayFin AI ----------
  const AI_KEY = "udayfin.aikey";
  const AI_MODEL = "claude-opus-5-5";

    "Which debt should I pay first?",

    "How do I reach my 30 lakh goal?",

  const AI_RULES = `You are Babe, the warm, cheerful money assistant built into UdayFin. You are a friendly personal money coach inside a budgeting app used by a young person in Nepal. Amounts are in Nepali rupees (Rs) unless marked. They get pocket money from their father at irregular times and sometimes earn commission or extra-work money.

Give practical advice based on their real numbers below. Be specific: name the debt, the amount, the week or month. Keep answers short and in simple English, with numbered steps where it helps, and finish with one clear next action. If you need a detail you don't have, such as a credit card interest rate, assume a typical value for Nepal, say that you assumed it, and invite them to tell you the real one.

For debts, explain the order you'd pay them and why (high interest like credit cards usually first, and keep promises to family and friends). For investing, cover the basics that fit Nepal (emergency fund first, fixed deposits, SIPs and mutual funds, NEPSE shares through Meroshare, gold) with honest risks. Never promise returns. Remind them briefly, once, that this is general guidance and not licensed financial advice.`;

  function aiKey() { try { return localStorage.getItem(AI_KEY) || ""; } catch { return ""; } }

  // A plain-text picture of the user's money for the model to reason over
  function aiSnapshot() { return real(aiSnapshotText); }
  function aiSnapshotText() {
    const t = today();
    const lines = [`Today: ${bs(t, true)} (${t}).`];
    lines.push("Accounts: " + D.accounts.map(a => `${a.name} ${money(accBal(a.id))}`).join("; ") + `. Total ${money(balance())}.`);
    const up = D.txns.filter(isUpcoming);
    if (up.length) lines.push("Expected soon: " + up.map(x => `${money(signed(x), undefined, "+")} on ${x.date} (${x.note || x.cat})`).join("; ") + ".");
    const owe = D.debts.filter(d => d.dir === "owe" && left(d) > 0);
    lines.push(owe.length ? "Debts I owe (amount left): " + owe.map(d => `${d.name}${d.note ? " (" + d.note + ")" : ""} ${money(left(d), d.currency)} of ${money(d.original, d.currency)}${d.due ? ", due " + d.due : ""}`).join("; ") + "." : "No debts.");
    const owed = D.debts.filter(d => d.dir === "owed" && left(d) > 0);
    if (owed.length) lines.push("Owed to me: " + owed.map(d => `${d.name} ${money(left(d), d.currency)}`).join("; ") + ".");
    const from = addDays(t, -29);
    const recent = D.txns.filter(x => x.date >= from && x.date <= t);
    const sumBy = (arr, key) => { const o = {}; arr.forEach(x => o[x[key] || "Other"] = (o[x[key] || "Other"] || 0) + x.amount); return Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${money(v)}`).join(", "); };
    const ins = recent.filter(x => x.type === "in"), outs = recent.filter(x => x.type === "out");
    lines.push(`Last 30 days received: ${money(ins.reduce((a, x) => a + x.amount, 0))}${ins.length ? " (" + sumBy(ins, "cat") + ")" : ""}.`);
    const hi = outs.filter(x => x.pri === "high").reduce((a, x) => a + x.amount, 0), lo = outs.filter(x => x.pri === "low").reduce((a, x) => a + x.amount, 0);
    lines.push(`Last 30 days spent: ${money(outs.reduce((a, x) => a + x.amount, 0))}; High ON (needed) ${money(hi)}, Low ON (could skip) ${money(lo)}${outs.length ? "; by category: " + sumBy(outs, "cat") : ""}.`);
    const weeks = [0, 1, 2, 3].map(i => { const w = weekData(addDays(weekStart(t), -7 * i)); return `${w.start}: spent ${money(w.spent)} (Low ON ${money(w.low)}), received ${money(w.got)}`; });
    lines.push("Weekly (newest first): " + weeks.join("; ") + ".");
    const big = [...outs].sort((a, b) => b.amount - a.amount).slice(0, 5);
    if (big.length) lines.push("Biggest recent spends: " + big.map(x => `${x.note || x.cat} ${money(x.amount)} (${x.pri === "low" ? "Low ON" : x.pri === "high" ? "High ON" : "unmarked"}, ${x.date})`).join("; ") + ".");
    if (D.settings.budget) lines.push(`Monthly spending budget: ${money(D.settings.budget)}.`);
    lines.push(D.savings.length ? "Savings pots: " + D.savings.map(p => `${p.name} ${money(p.balance || 0)}${p.target ? " of " + money(p.target) : ""}`).join("; ") + "." : "No savings pots yet.");
    lines.push(D.investments.length ? "Investments: " + D.investments.map(i => `${i.name} (${i.kind}) put in ${money(i.invested)}, worth ${money(i.value)}`).join("; ") + "." : "No investments yet.");
    const g = D.goal;
    lines.push(`Main goal: ${g.name || "Main goal"}, target ${money(g.target)} (${lakh(g.target)}), progress ${money(goalProgress())}${g.by ? ", target date " + g.by : ", no target date"}.`);
    const nw = balance() + savedTotal() + investedValue() + (debtTotals("owed").NPR || 0) - (debtTotals("owe").NPR || 0);
    lines.push(`Net worth in rupees: ${money(nw)}.`);
    return lines.join("\n");
  }

  let aiTurns = [];          // [{role, content}], first user turn carries the data snapshot
  let aiBusy = false;
  let aiCtl = null;
  let aiSampleFn;            // the claude.ai preview's own Claude, when this page runs there

  async function aiProvider() {
    if (aiSampleFn === undefined) {
      try { aiSampleFn = window.claude?.use ? await window.claude.use("sample") : null; } catch { aiSampleFn = null; }
    }
    if (aiSampleFn) return "sample";
    if (aiKey()) return "key";
    return null;
  }

  function aiText(md) {
    // Small, safe formatting: escape everything, then bold and headings
    const esc = md.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    return esc.replace(/^#{1,4}\s*(.+)$/gm, "<b>$1</b>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  }

  async function askAI(question, opts = {}) {
    question = (question || "").trim();
    if (!question || aiBusy) return;
    // "spent 250 on momo" is an entry, not a question
    if (!/\?|^(which|what|how|should|can|is|are|why|when|where|do|does|tell|explain|help|kun|kasari|ke)\b/i.test(question) && /\b(spent|spend|paid|bought|got|received|gave me|earned|kharcha)\b|खर्च|तिरें/i.test(question)) {
      const parsed = parseSentence(question);
      if (parsed) {
        if (talkMode) { talkMode = false; stopListening(); }
        openParsed(parsed, question, "voice");
        if (opts.voice && canSpeak()) speak(parsed.kind === "debt" ? `Okay, payment to ${parsed.debt.name}. Check it and tap save.` : `Okay, ${parsed.type === "in" ? "received" : "spent"} ${real(() => money(parsed.amount))}. Check it and tap save.`);
        return;
      }
    }
    const prov = await aiProvider();
    if (!prov) { tab = "advisor"; aiTurns.push({ role: "user", content: question, error: true }, { role: "assistant", content: "", error: "noKey" }); render(); return; }
    if (!navigator.onLine && prov === "key") { aiTurns.push({ role: "user", content: question, error: true }, { role: "assistant", content: "", error: "offline" }); render(); return; }
    const first = !aiTurns.some(t => t.role === "user" && !t.error);
    const voiceNote = opts.voice ? `\n\n(I'm talking to you by voice. Answer in 2 to 4 short, natural spoken sentences, with no lists, symbols or headings.${(D.settings.voiceLang || "en-IN") === "ne-NP" ? " Reply in Nepali." : ""})` : "";
    aiTurns.push({ role: "user", content: question, wire: (first ? `My money right now:\n${aiSnapshot()}\n\nMy question: ${question}` : question) + voiceNote });
    const reply = { role: "assistant", content: "", pending: true };
    aiTurns.push(reply);
    aiBusy = true; render();
    const wire = aiTurns.filter(t => !t.error && !t.pending).map(t => ({ role: t.role, content: t.wire || t.content }));
    const update = () => { const b = document.getElementById("aiLive"); if (b) { b.classList.remove("thinking"); b.innerHTML = aiText(reply.content); } };
    aiCtl = new AbortController();
    try {
      if (prov === "sample") {
        wire[0] = { role: "user", content: AI_RULES + "\n\n" + wire[0].content };
        const { text } = await aiSampleFn(wire, { cache: false, signal: aiCtl.signal, onText: ({ text }) => { reply.content = text; update(); } });
        reply.content = text;
      } else {
        const { default: Anthropic } = await import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm");
        const client = new Anthropic({ apiKey: aiKey(), dangerouslyAllowBrowser: true });
        try {
          const stream = client.beta.messages.stream({
            model: AI_MODEL,
            max_tokens: 8000,
            betas: ["server-side-fallback-2026-07-01"],
            fallbacks: "default",
            output_config: { effort: "medium" },
            system: AI_RULES,
            messages: wire
          }, { signal: aiCtl.signal });
          stream.on("text", delta => { reply.content += delta; update(); });
          const msg = await stream.finalMessage();
          if (msg.stop_reason === "refusal" && !reply.content) reply.error = "refusal";
        } catch (e) {
          if (e instanceof Anthropic.AuthenticationError || e instanceof Anthropic.PermissionDeniedError) reply.error = "badKey";
          else if (e instanceof Anthropic.RateLimitError) reply.error = "busy";
          else if (e instanceof Anthropic.APIUserAbortError) reply.error = "stopped";
          else if (e instanceof Anthropic.BadRequestError && /credit/i.test(e.message || "")) reply.error = "credit";
          else if (e instanceof Anthropic.APIConnectionError) reply.error = "offline";
          else if (e instanceof Anthropic.APIError) reply.error = "server";
          else throw e;
        }
      }
    } catch (e) {
      reply.error = e?.code === "cancelled" ? "stopped" : e?.code === "not_granted" ? "declined" : e?.code === "rate_limited" ? "busy" : (e instanceof TypeError ? "offline" : "server");
      if (e?.text) reply.content = e.text;
    } finally {
      reply.pending = false; aiBusy = false; aiCtl = null;
      if (reply.error && !reply.content) { const i = aiTurns.indexOf(reply); aiTurns.splice(i - 1, 2, { role: "user", content: question, error: true }, reply); }
      if (tab === "advisor") render();
      if (opts.voice && reply.content && !reply.error) speak(reply.content, () => { if (talkMode && tab === "advisor") listen(); });
      else if (opts.voice && talkMode) { talkMode = false; render(); }
    }
  }

  const AI_ERRORS = {

    const copy = el("button", { class: "btn soft", type: "button", onclick: () => {
      const txt = `${AI_RULES}\n\nMy money right now:\n${aiSnapshot()}\n\nMy question: `;
      navigator.clipboard?.writeText(txt).then(() => toast("Copied. Paste it into the Claude app and add your question."), () => toast("Couldn't copy here"));
    } }, "Copy my summary");
    return [topbar("Babe", talkMode ? "Voice conversation" : "Your money assistant"), voicePanel(), starters, chat, form,
      el("section", { class: "card" },
        el("div", { class: "note" }, "To answer, Babe sends a summary of your balances, debts, spending and goal to Claude (made by Anthropic). Answers are general guidance, not licensed financial advice."),
        el("div", { class: "two" }, copy, el("button", { class: "btn soft", type: "button", disabled: aiBusy || !aiTurns.length, onclick: () => { aiTurns = []; render(); } }, "New chat")))];
  }

  function payDebt(d, amt, acc) {
    const owe = d.dir === "owe", l = left(d);
    const txnId = acc ? uid() : null;
    d.payments = [...(d.payments || []), { amount: amt, date: today(), at: Date.now(), txn: txnId }];
    if (txnId) { D.settings.lastAcc = acc; D.txns.push({ id: txnId, type: owe ? "out" : "in", amount: amt, cat: owe ? "Debt payment" : "Got back", pri: owe ? "high" : undefined, note: (owe ? "Paid " : "From ") + d.name, acc, date: today(), at: Date.now() }); }
    commit(l - amt === 0 ? (owe ? `${d.name} is paid off` : `${d.name} paid you back fully`) : `${money(l - amt, d.currency)} left with ${d.name}`);
  }

  // ---------- Quick add: understand a sentence or a bank SMS (runs on the phone) ----------
  const DEV = { "०": 0, "१": 1, "२": 2, "३": 3, "४": 4, "५": 5, "६": 6, "७": 7, "८": 8, "९": 9 };
  const normDigits = t => t.replace(/[०-९]/g, c => DEV[c]);
  const ACC_WORDS = [["khalti", /khalti|खल्ती/i], ["esewa", /e-?sewa|इसेवा/i], ["nabil", /nabil|नबिल/i], ["siddhartha", /siddhartha|siddharth|\bsbl\b|सिद्धार्थ/i], ["cash", /\bcash\b|wallet|nagad|नगद|pocket/i]];
  const CAT_WORDS = [
    ["Food", /momo|food|khana|खाना|lunch|dinner|breakfast|tea|chiya|chiya|coffee|snack|chowmein|pizza|burger|restaurant|canteen|grocer|milk|fruit|samosa|sel ?roti|bhat.?bhateni|salesberry|big ?mart|supermarket|mart\b/i],
    ["Transport", /bus|taxi|pathao|indrive|tootle|fuel|petrol|diesel|bike|micro|tempo|ride|parking|travel/i],
    ["Mobile/Data", /recharge|top ?up|topup|data|ntc|ncell|internet|wifi|worldlink|vianet|mobile/i],
    ["College", /college|fee|fees|book|exam|tuition|notes|stationery|pen|copy|class|course/i],
    ["Shopping", /cloth|shirt|pant|shoe|shopping|daraz|dress|jacket|watch|bag/i],
    ["Friends", /friend|party|outing|movie|treat|birthday|picnic|gift|hangout|trip|game/i]];
  const LOW_WORDS = /party|movie|outing|treat|snack|momo|pizza|burger|coffee|game|shopping|daraz|cloth|shoe|trip|picnic/i;
  const IN_WORDS = /\b(got|get|received|receive|earned|earn|gave me|give me|sent me|credited|deposited|income|salary|commission|pocket money)\b|आयो|पाएँ|पाए/i;
  function parseAmount(t) {
    t = normDigits(t).replace(/(\d),(?=\d)/g, "$1");
    const m = t.match(/(?:rs\.?|npr|रु\.?|रू\.?)?\s*(\d+(?:\.\d+)?)\s*(k\b|thousand|hajar|hazar|हजार|lakh|lac|लाख)?/i);
    if (!m) return 0;
    let n = parseFloat(m[1]);
    const u = (m[2] || "").toLowerCase();
    if (/^k$|thousand|hajar|hazar|हजार/.test(u)) n *= 1000;
    if (/lakh|lac|लाख/.test(u)) n *= 100000;
    return Math.round(n * 100);
  }
  function findAccount(t) { for (const [id, re] of ACC_WORDS) if (re.test(t) && D.accounts.some(a => a.id === id)) return id; return D.accounts.find(a => new RegExp("\\b" + a.name.split(" ")[0].replace(/[^\w]/g, "") + "\\b", "i").test(t))?.id || ""; }
  function findCat(t, type) {
    if (type === "in") return /papa|father|dad|baba|buwa|बुवा|ba\b/i.test(t) ? "From father" : /commission|कमिशन/i.test(t) ? "Commission" : /work|job|freelance|project|extra/i.test(t) ? "Extra work" : /gift/i.test(t) ? "Gift" : "Other";
    for (const [c, re] of CAT_WORDS) if (re.test(t)) return c;
    return "Other";
  }
  // "I spent 250 on momo from Khalti", "papa gave me 5k", "paid Ravi dai 500"
  function parseSentence(raw) {
    const t = normDigits(raw.trim());
    const amount = parseAmount(t);
    if (!amount) return null;
    const lower = t.toLowerCase();
    // A payment to someone on the debt list
    const debt = D.debts.find(d => left(d) > 0 && lower.includes(d.name.toLowerCase().split(" ")[0]) && (d.dir === "owe" ? /\b(paid|pay|gave|give|returned|sent)\b|तिरें|दिएँ/i.test(t) : /\b(got|received|returned|gave me|paid me)\b/i.test(t)));
    if (debt) return { kind: "debt", debt, amount: Math.min(amount, left(debt)), acc: findAccount(t) };
    const type = IN_WORDS.test(t) || /\b(papa|father|dad|buwa)\b.*\b(gave|sent)\b/i.test(t) ? "in" : "out";
    const cat = findCat(t, type);
    const date = /yesterday|hijo|हिजो/i.test(t) ? addDays(today(), -1) : today();

  function addMonthsISO(iso, n) {

  // Pay the monthly amount into debts in priority order; interest added monthly.
  function simulatePlan(monthly, method) {
    const ds = D.debts.filter(d => d.dir === "owe" && d.currency === D.settings.currency && left(d) > 0)
      .map(d => ({ id: d.id, name: d.name, bal: left(d), rate: d.rate || 0, done: null }));
    const order = [...ds].sort(method === "small" ? (a, b) => a.bal - b.bal : (a, b) => b.rate - a.rate || a.bal - b.bal);
    // This month's money already paid counts towards month 0
    const mk = monthKey(today());
    const paidNow = D.debts.reduce((s, d) => s + (d.payments || []).filter(p => monthKey(p.date) === mk).reduce((a, p) => a + p.amount, 0), 0);
    let interest = 0, m = 0;
    const firstMonth = [];
    for (; m < 600 && order.some(x => x.bal > 0); m++) {
      let budget = m === 0 ? Math.max(0, monthly - paidNow) : monthly;
      if (m > 0) order.forEach(x => { if (x.bal > 0 && x.rate) { const i = Math.round(x.bal * x.rate / 1200); x.bal += i; interest += i; } });
      for (const x of order) {
        if (budget <= 0) break;
        if (x.bal <= 0) continue;
        const pay = Math.min(x.bal, budget);
        x.bal -= pay; budget -= pay;
        if (m === 0) firstMonth.push({ name: x.name, amount: pay });
        if (x.bal === 0) x.done = m;
      }
      if (m > 24 && monthly <= order.reduce((s, x) => s + Math.round(x.bal * x.rate / 1200), 0)) return { never: true, order, paidNow };
    }
    if (order.some(x => x.bal > 0)) return { never: true, order, paidNow };
    return { order, months: m - 1, interest, firstMonth, paidNow, end: addMonthsISO(today(), Math.max(0, m - 1)) };
  }

    const owe = debtTotals("owe")[D.settings.currency] || 0;
    const toGo = Math.max(0, D.goal.target - goalProgress());
    if (!tx.length) return el("section", { class: "card" }, el("h2", {}, "Goal pace"), el("div", { class: "small muted" }, "Add what you receive and spend for a few weeks, and UdayFin will estimate when you reach your goal."));
    let msg;
    if (perMonth <= 0) msg = `Right now you spend more than you get (${money(perMonth)} a month). Cut Low ON spends first. Every rupee you keep moves the goal closer.`;
    else {
      const months = Math.ceil((toGo + owe) / perMonth);
      const yrs = months / 12;
      msg = `You're keeping about ${money(perMonth)} a month. At this pace you'd clear your debts${owe ? ` (${money(owe)})` : ""} and reach ${lakh(D.goal.target)} in about ${yrs >= 1 ? yrs.toFixed(1) + " years" : months + " months"} (${bsMonthYear(addMonthsISO(t, months))}).`;
    }
    const need10 = Math.ceil((toGo + owe) / 120 / 100) * 100;
    return el("section", { class: "card" }, el("h2", {}, "Goal pace"), el("div", { class: "insight" }, msg),
      el("div", { class: "small muted" }, `To reach it in 10 years you'd need to keep about ${money(need10)} a month. Investments that grow help a lot over that time.`),
      el("div", { class: "note" }, `Based on the last ${days} days.`));
  }

  // ---------- Motivation ----------
  function milestones() {
    const L = 1e5 * 100, target = D.goal.target || 0;
    const steps = [0.25, 0.5, 1, 2, 3, 5, 7.5, 10, 15, 20, 25, 30, 40, 50, 75, 100].map(x => x * L).filter(v => v < target);
    if (target) steps.push(target);
    return steps;
  }
  function checkMilestones(silent) {
    const g = D.goal, p = goalProgress();
    const fresh = !Array.isArray(g.hit);
    g.hit ||= [];
    const newly = milestones().filter(m => p >= m && !g.hit.includes(m));
    if (!newly.length) return;
    g.hit.push(...newly); save();
    if (!silent && !fresh) celebrate(Math.max(...newly));
  }
  function celebrate(m) {
    const root = $("#partyRoot");
    const pct = Math.min(100, goalProgress() / (D.goal.target || 1) * 100);
    const done = m >= D.goal.target;
    const cv = el("canvas", { "aria-hidden": "true" });
    root.replaceChildren(el("div", { class: "celebrate", role: "dialog", "aria-modal": "true", onclick: e => { if (e.target.classList.contains("celebrate")) root.replaceChildren(); } },
      cv,
      el("div", { class: "box" }, el("div", { class: "e", "aria-hidden": "true" }, done ? "🏆" : "🎉"),
        el("h2", {}, done ? "You reached your main goal!" : `${lakh(m)} reached!`),
        el("div", { class: "small muted" }, done ? `${lakh(D.goal.target)} saved and invested. Amazing work!` : `Your savings and investments passed ${lakh(m)}. That's ${pct.toFixed(1)}% of your ${lakh(D.goal.target)} goal.`),
        el("button", { class: "btn block", type: "button", onclick: () => root.replaceChildren() }, "Keep going"))));
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const colors = ["#20c98a", "#1d63e8", "#f3b85c", "#ff8a7f", "#ffffff"];
    const bits = Array.from({ length: 120 }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.5, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, s: 4 + Math.random() * 5, c: colors[Math.floor(Math.random() * colors.length)], r: Math.random() * 6 }));
    let frames = 0;
    (function tick() {
      if (!cv.isConnected || frames++ > 240) return;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.r += 0.1; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); });
      requestAnimationFrame(tick);
    })();
  }

  // Days in a row with no Low ON spending
  function streaks() {
    const lowDays = new Set(D.txns.filter(t => t.type === "out" && t.pri === "low").map(t => t.date));
    const first = D.txns.filter(t => t.type === "out").map(t => t.date).sort()[0];
    if (!first) return null;
    let cur = 0, best = 0, run = 0;
    for (let d = first; d <= today(); d = addDays(d, 1)) { if (lowDays.has(d)) run = 0; else { run++; best = Math.max(best, run); } }
    cur = run;
    return { cur, best };
  }
  function streakCard() {
    const st = streaks();
    if (!st) return null;
    return el("section", { class: "card streak" },
      el("div", { class: "flame", "aria-hidden": "true" }, st.cur ? "🔥" : "💤"),
      el("div", {}, el("div", { style: "font-weight:700" }, st.cur ? `${st.cur} ${st.cur === 1 ? "day" : "days"} with no Low ON spending` : "Streak reset today. Start again tomorrow!"),
        el("div", { class: "small muted" }, `Best: ${st.best} ${st.best === 1 ? "day" : "days"}`)));
  }

  // 52-week challenge: week n saves n × step
  function challengeStarter() {
    let step = 10000;
    const sel = el("select", { id: "chStep", "aria-label": "Weekly step", onchange: e => { step = +e.target.value; info.textContent = text(); } },
      [5000, 10000, 20000].map(v => el("option", { value: v, selected: v === 10000 }, `Rs ${v / 100} more each week`)));
    const text = () => `Week 1 save Rs ${step / 100}, week 2 Rs ${step / 50}… week 52 Rs ${step * 52 / 100}. Total ${real(() => money(step * 1378))} in a year.`;
    const info = el("div", { class: "small muted" }, text());
    return el("div", { class: "pot", style: "border-top:1px solid var(--line)" },
      el("div", { class: "t" }, "52-week challenge"), info,
      el("div", { class: "payrow" }, sel, el("button", { class: "btn", type: "button", onclick: () => {
        D.savings.push({ id: uid(), name: "52-week challenge", target: step * 1378, balance: 0, challenge: { step, start: weekStart(today()), done: [] } });
        commit("Challenge started! Week 1: " + money(step));
      } }, "Start")));
  }
  function challengeBlock(pot) {
    const c = pot.challenge;
    const week = Math.min(52, Math.floor((Date.parse(today()) - Date.parse(c.start)) / (7 * 864e5)) + 1);
    const thisDone = c.done.includes(week);
    const missed = Array.from({ length: week - 1 }, (_, i) => i + 1).filter(w => !c.done.includes(w));
    const nextW = thisDone ? missed[0] : week;
    return el("div", { class: "pot" },
      el("div", { class: "pot-top" }, el("div", {}, el("div", { class: "t" }, "52-week challenge"), el("div", { class: "small muted" }, `Week ${week} of 52 · ${c.done.length} done`)), el("div", { class: "v" }, money(pot.balance || 0))),
      el("div", { class: "weeks52", role: "img", "aria-label": `${c.done.length} of 52 weeks done` }, Array.from({ length: 52 }, (_, i) => el("i", { class: (c.done.includes(i + 1) ? "done" : "") + (i + 1 === week ? " now" : "") }))),
      el("div", { class: "btnrow" },
        nextW ? el("button", { class: "btn", type: "button", onclick: () => openSaveMove(pot, "add", { amount: c.step * nextW, week: nextW }) }, `Save ${money(c.step * nextW)} for week ${nextW}`) : el("span", { class: "chip ok" }, "This week done ✓"),
        el("button", { class: "btn soft", type: "button", onclick: () => openSaveMove(pot, "take"), disabled: !(pot.balance > 0) }, "Take out"),
        el("button", { class: "link", type: "button", onclick: () => openPot(pot) }, "Edit")),
      missed.length > (thisDone ? 1 : 0) ? el("div", { class: "note" }, `Catch up: week ${missed.slice(0, 5).join(", ")}${missed.length > 5 ? "…" : ""}`) : null);
  }

  // ---------- Welcome (first open) ----------
  function showWelcome() {
    const root = $("#welcomeRoot");
    let i = 0;
    const nameIn = el("input", { id: "wName", maxlength: "24", placeholder: "Your name", value: D.settings.userName || "" });
    const balIns = D.accounts.map(a => [a, el("input", { id: "wb-" + a.id, type: "number", inputmode: "decimal", step: "0.01", placeholder: "0", value: accBal(a.id) ? accBal(a.id) / 100 : "" })]);
    const slides = [
      () => el("div", { class: "slide" }, el("div", { class: "art" }, el("img", { src: "logo-96.png", alt: "UdayFin logo" })),
        el("h2", {}, ["Welcome to Uday", el("span", { style: "color:var(--in)" }, "Fin")]),
        el("p", {}, "Your money, your goals, all in one place. It works offline and your data stays on this phone.")),
      () => el("div", { class: "slide" }, el("div", { class: "art" }, "📊"),
        el("h2", {}, "Know where every rupee goes"),
        el("div", { class: "feats" }, el("div", {}, "🔴🟢 Mark each spend High ON or Low ON"), el("div", {}, "💳 A plan to clear your debts, with your debt-free date"), el("div", {}, "🎯 Track your Rs 30 lakh goal, savings and investments"))),
      () => el("div", { class: "slide" }, Object.assign(el("div", { class: "art", style: "background:var(--card)" }), { innerHTML: BABE_SVG.replace('class="babe"', 'width="110" height="110"') }),
        el("h2", {}, "Meet Babe 💙"),
        el("p", {}, "Your money assistant. Ask by typing or talk by voice. She knows your numbers and helps you decide what to do next.")),
      () => el("div", { class: "slide" }, el("h2", {}, "Let's set you up"),
        el("div", { class: "setup" },
          el("label", { class: "field" }, el("span", {}, "What should I call you?"), nameIn),
          el("div", { class: "small muted" }, "How much is in each account right now? (You can change this later.)"),
          ...balIns.map(([a, inp]) => el("label", { class: "field" }, el("span", {}, a.name), inp))))
    ];
    function finish(saveSetup) {
      if (saveSetup) {
        D.settings.userName = nameIn.value.trim();
        balIns.forEach(([a, inp]) => { if (inp.value !== "") { const want = toMinor(inp.value || 0); a.opening = (a.opening || 0) + (want - accBal(a.id)); } });
      }
      D.settings.onboarded = true; shownBal = 0;
      root.replaceChildren(); commit(saveSetup ? `Welcome${D.settings.userName ? ", " + D.settings.userName : ""}! 🎉` : null);
    }
    function draw() {
      const last = i === slides.length - 1;
      root.replaceChildren(el("div", { class: "welcome", role: "dialog", "aria-modal": "true", "aria-label": "Welcome" },
        slides[i](),
        el("div", { class: "foot" },
          el("div", { class: "pips", "aria-hidden": "true" }, slides.map((_, k) => el("i", { class: k === i ? "on" : "" }))),
          el("button", { class: "btn block", type: "button", onclick: () => { buzz(8); if (last) finish(true); else { i++; draw(); } } }, last ? "Start using UdayFin" : i === 0 ? "Get started" : "Next"),
          el("div", { class: "two" },
            i > 0 ? el("button", { class: "btn soft", type: "button", onclick: () => { i--; draw(); } }, "Back") : el("span"),
            !last ? el("button", { class: "btn soft", type: "button", onclick: () => finish(false) }, "Skip") : el("span")))));
    }
    draw();
  }

  // ---------- Render ----------
  let lastTab = null, shownBal = null;
  function applyTheme() {
    const r = document.documentElement;
    const acc = D.settings.accent || "ocean";
    if (acc === "ocean") delete r.dataset.accent; else r.dataset.accent = acc;
    if (D.settings.mode === "light" || D.settings.mode === "dark") r.dataset.theme = D.settings.mode;
    else if (D.settings.modeSet) delete r.dataset.theme;
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", getComputedStyle(r).getPropertyValue("--hero-a").trim() || "#061a3d");
  }
  function countUp() {
    const elx = document.querySelector("[data-count]");
    if (!elx || D.settings.hide) return;
    const to = +elx.dataset.count, from = shownBal ?? 0;
    shownBal = to;
    if (from === to || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const t0 = performance.now(), dur = 700;
    (function step(now) {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      if (!elx.isConnected) return;
      elx.textContent = money(Math.round((from + (to - from) * e) / 100) * 100);
      if (k < 1) requestAnimationFrame(step); else elx.textContent = money(to);
    })(t0);
  }
  const buzz = (ms = 12) => { try { navigator.vibrate?.(ms); } catch {} };
  function render() {
    const app = $("#app");
    applyTheme();
    const views = { home: viewHome, week: viewSummary, entries: viewEntries, wealth: viewWealth, debts: viewDebts, more: viewMore, advisor: viewAdvisor };
    app.replaceChildren(...views[tab]());
    if (tab !== lastTab) { app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter"); lastTab = tab; }
    if (tab === "home") countUp();
    document.querySelectorAll(".nav button[data-tab]").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  }
  function go(t) { tab = t; render(); window.scrollTo(0, 0); }
  document.querySelectorAll(".nav button[data-tab]").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
  $("#addBtn").addEventListener("click", () => openAdd());
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  runRepeats(); recordNw(); checkMilestones(true); save();
  render();
  if (locked) showLock();
  else if (!D.settings.onboarded) showWelcome();
  // Home-screen shortcuts open straight into the add sheet
  try {
    const want = new URLSearchParams(location.search).get("add");
    if (want === "out" || want === "in") {
      history.replaceState(null, "", location.pathname);
      const open = () => openAdd({ type: want, cat: want === "in" ? "From father" : undefined });
      if (locked) { const iv = setInterval(() => { if (!locked) { clearInterval(iv); open(); } }, 300); } else open();
    }
  } catch {}

  // Offline support when installed from its own web address
  try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch {}
})();
</script>
